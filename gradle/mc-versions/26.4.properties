# Coordinates for Minecraft 26.4 (development snapshot).
# See COMPAT.md — add a new file here to support another version.
#
# 26.4 is still in the snapshot phase, so the Minecraft coordinate points at the newest
# snapshot that Fabric API covers (26.4-snapshot-4).

minecraft=26.4-snapshot-4
fabric-api=0.164.0+26.4

# Compile-only mod integrations (must match the Minecraft version above).
# Sodium, Lithium and Iris have no 26.4 build yet, so the latest 26.3 ones are used.
sodium=mc26.3-0.9.2-fabric
lithium=mc26.3-0.26.1-fabric
iris=1.11.5+26.3-fabric
modmenu=22.0.0-alpha.2
baritone=26.1-SNAPSHOT
viafabricplus=4.6.1

# Version-specific sources live in src/mc/26.4/
compat-impl=meteordevelopment.meteorclient.compat.impl.Mc264Compat

# 26.3 no longer depends on LWJGL's tinyfd, which the shared code still uses for file dialogs.
extra-compile-deps=org.lwjgl:lwjgl-tinyfd:3.4.1
