[versions]
# Fabric (https://fabricmc.net/develop)
jdk = "25"
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-api = "0.154.2+26.2"

# Plugins
# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.17-SNAPSHOT"
# Error Prone Plugin (https://github.com/tbroyer/gradle-errorprone-plugin)
errorprone-plugin = "5.1.1"

# Mods
# Baritone (https://github.com/MeteorDevelopment/baritone)
baritone = "26.1-SNAPSHOT"
# Sodium (https://github.com/CaffeineMC/sodium-fabric)
sodium = "mc26.2-0.9.1-fabric"
# Lithium (https://github.com/CaffeineMC/lithium-fabric)
lithium = "mc26.2-0.25.2-fabric"
# Iris (https://github.com/IrisShaders/Iris)
iris = "1.11.2+26.2-fabric"
# ModMenu (https://github.com/TerraformersMC/ModMenu)
modmenu = "20.0.1"
# Orbit (https://github.com/MeteorDevelopment/orbit)
orbit = "0.2.4"
# Starscript (https://github.com/MeteorDevelopment/starscript)
starscript = "0.2.5"
# DiscordRPC (https://github.com/MeteorDevelopment/java-discord-rpc)
discordipc = "1.1"
# Reflections (https://github.com/ronmamo/reflections)
reflections = "0.10.2"
# Netty (https://github.com/netty/netty)
netty = "4.2.15.Final"
# ViaFabricPlus (https://github.com/ViaVersion/ViaFabricPlus)
viafabricplus = "4.6.1"
# WaybackAuthLib (https://github.com/florianreuth/WaybackAuthLib)
waybackauthlib = "1.1.0"
# MinecraftAuth (https://github.com/RaphiMC/MinecraftAuth)
minecraftauth = "5.0.2"

# Libraries
# Error Prone (https://github.com/google/error-prone)
errorprone = "2.50.0"
# NullAway (https://github.com/uber/NullAway)
nullaway = "0.14.0"

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Mods
sodium = { module = "maven.modrinth:sodium", version.ref = "sodium" }
lithium = { module = "maven.modrinth:lithium", version.ref = "lithium" }
iris = { module = "maven.modrinth:iris", version.ref = "iris" }
baritone = { module = "meteordevelopment:baritone", version.ref = "baritone" }
modmenu = { module = "maven.modrinth:modmenu", version.ref = "modmenu" }
viafabricplus = { module = "com.viaversion:viafabricplus", version.ref = "viafabricplus" }
viafabricplus-api = { module = "com.viaversion:viafabricplus-api", version.ref = "viafabricplus" }

# Libraries
orbit = { module = "meteordevelopment:orbit", version.ref = "orbit" }
starscript = { module = "org.meteordev:starscript", version.ref = "starscript" }
discord-ipc = { module = "meteordevelopment:discord-ipc", version.ref = "discordipc" }
reflections = { module = "org.reflections:reflections", version.ref = "reflections" }
netty-handler-proxy = { module = "io.netty:netty-handler-proxy", version.ref = "netty" }
netty-codec-socks = { module = "io.netty:netty-codec-socks", version.ref = "netty" }
waybackauthlib = { module = "de.florianreuth:waybackauthlib", version.ref = "waybackauthlib" }
minecraft-auth = { module = "net.raphimc:MinecraftAuth", version.ref = "minecraftauth" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
